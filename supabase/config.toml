project_id = "outlist"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000"]
# Account creation is reserved for the trusted Supabase administrative workflow.
enable_signup = false

[auth.email]
otp_expiry = 60

[auth.email.template.magic_link]
subject = "Your Outlist administrator sign-in code"
content_path = "./supabase/templates/admin-otp.html"

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
